[project]
name = "adaptaste-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Marlon-Sbardelatti", email = "hetzwga@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "emoji>=2.0",
    "fastapi>=0.163.1",
    "joblib>=1.3",
    "nltk>=3.8",
    "numpy>=1.26",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pymongo>=4.20.0",
    "pt-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "spacy>=3.7",
    "torch>=2.2",
    "transformers>=4.40",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "scripts"]

